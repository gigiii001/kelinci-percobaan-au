<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone</title>
<style>
:root{--bg:#fff;--tx:#000;--mut:#8e8e93;--blue:#007aff;--gray:#e9e9eb;--grayT:#000;--bd:rgba(60,60,67,.2);
--glass:rgba(255,255,255,.45);--glassBd:rgba(255,255,255,.7);--hi:rgba(255,255,255,.85);--sh:rgba(0,0,0,.14);--ph:rgba(60,60,67,.5);--card:#f2f2f7}
@media (prefers-color-scheme:dark){:root{--bg:#000;--tx:#fff;--gray:#262628;--grayT:#fff;--bd:rgba(84,84,88,.6);
--glass:rgba(58,58,62,.45);--glassBd:rgba(255,255,255,.18);--hi:rgba(255,255,255,.28);--sh:rgba(0,0,0,.5);--ph:rgba(235,235,245,.45);--card:#1c1c1e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;justify-content:center;background:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#phone{position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;background:#000}
@media(min-width:500px){body{align-items:center;background:#111}#phone{height:min(100dvh,880px);border-radius:46px;box-shadow:0 0 0 10px #1c1c1e,0 30px 80px rgba(0,0,0,.6)}}
#wall{position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,#ff9a8b,transparent 45%),radial-gradient(circle at 85% 30%,#6a8dff,transparent 50%),radial-gradient(circle at 50% 95%,#c471ed,transparent 55%),#2b2250}
.g{background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);border:.5px solid rgba(255,255,255,.4);box-shadow:0 8px 28px rgba(0,0,0,.18),inset 0 1.5px 1px rgba(255,255,255,.55)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);border:.5px solid var(--glassBd);box-shadow:0 8px 28px var(--sh),inset 0 1.5px 1px var(--hi)}
#sb{position:absolute;top:0;left:0;right:0;height:50px;padding:16px 30px 0;display:flex;justify-content:space-between;font-size:15px;font-weight:600;z-index:60;color:#fff;pointer-events:none}
[data-view=app] #sb{color:var(--tx)}
#hbar{position:absolute;bottom:0;left:0;right:0;height:28px;z-index:70;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;color:#fff;cursor:pointer}
#hbar i{width:134px;height:5px;border-radius:3px;background:currentColor}
[data-view=app] #hbar{color:var(--tx)}
[data-view=lock] #hbar,[data-view=pin] #hbar{opacity:0;pointer-events:none}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
.scr.on{opacity:1;pointer-events:auto}
/* lock */
#lock{color:#fff;text-align:center}
#ld{margin-top:78px;font-size:20px;font-weight:600;opacity:.9}
#lt{font-size:92px;font-weight:700;line-height:1;letter-spacing:-2px;margin-top:2px}
#nw{position:absolute;left:12px;right:12px;bottom:140px}
.notif{display:flex;gap:10px;padding:12px 14px;border-radius:24px;text-align:left;color:#fff;cursor:pointer;animation:drop .6s cubic-bezier(.2,1.1,.3,1)}
.notif .ic{width:38px;height:38px;border-radius:9px;background:url(imess.jpg) center/cover;flex-shrink:0}
.notif b{font-size:15px}.notif p{margin:1px 0 0;font-size:15px;line-height:1.25}.notif time{margin-left:auto;font-size:12px;opacity:.75}
.nt{display:flex;gap:6px}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.92)}to{opacity:1;transform:none}}
#hint{position:absolute;bottom:44px;left:0;right:0;font-size:15px;font-weight:500;animation:pl 2s infinite}
@keyframes pl{50%{opacity:.4}}
/* pin */
#pin{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);color:#fff;text-align:center;padding-top:110px}
#pin h2{margin:0 0 22px;font-size:20px;font-weight:600}
#dots{display:flex;gap:18px;justify-content:center;margin-bottom:40px}
#dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid #fff}
#dots i.f{background:#fff}
#dots.sh{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
#kp{display:grid;grid-template-columns:repeat(3,78px);gap:16px 22px;justify-content:center}
#kp button{width:78px;height:78px;border-radius:50%;font-size:32px;background:rgba(255,255,255,.18);color:#fff;transition:background .15s}
#kp button:active{background:rgba(255,255,255,.45)}
#kp .e{background:none!important;font-size:17px}
/* home */
#home{color:#fff}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:84px 18px 0}
.app-i{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;position:relative}
.ico{width:62px;height:62px;border-radius:17px;display:grid;place-items:center;font-size:32px;box-shadow:0 4px 12px rgba(0,0,0,.25),inset 0 1.5px 1px rgba(255,255,255,.6);transition:transform .15s}
.app-i:active .ico{transform:scale(.9)}
.bdg{position:absolute;top:-6px;right:6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:14px;font-weight:600;display:grid;place-items:center}
#dock{position:absolute;left:14px;right:14px;bottom:34px;height:92px;border-radius:36px;display:flex;justify-content:space-evenly;align-items:center}
#dock .app-i span{display:none}
/* apps */
.app{position:absolute;inset:0;z-index:20;background:var(--bg);color:var(--tx);overflow:hidden;transform:scale(.08);opacity:0;pointer-events:none;border-radius:44px;transition:transform .38s cubic-bezier(.2,.9,.3,1),opacity .25s,border-radius .38s}
.app.open{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.top{position:absolute;top:0;left:0;right:0;z-index:5;padding:56px 16px 10px;background:linear-gradient(var(--bg) 60%,transparent)}
.top h1{margin:6px 0 0;font-size:34px}
.body{position:absolute;inset:0;overflow-y:auto;padding:122px 16px 40px}
/* photos */
#pg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -16px}
.tile{aspect-ratio:1;display:grid;place-items:center;font-size:44px;background-size:cover;background-position:center;cursor:pointer}
.plus-b{position:absolute;right:16px;top:62px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--blue);font-size:24px}
#viewer{position:absolute;inset:0;z-index:30;background:#000;display:none;place-items:center;font-size:160px;cursor:pointer;background-size:contain;background-repeat:no-repeat;background-position:center}
/* music */
#art{width:200px;height:200px;margin:6px auto 18px;border-radius:22px;background:linear-gradient(135deg,#ff6a88,#c471ed);display:grid;place-items:center;font-size:80px;box-shadow:0 20px 40px var(--sh);transition:transform .4s}
#art.p{transform:scale(1.05)}
.mt{text-align:center}.mt b{font-size:20px;display:block}.mt span{color:var(--mut)}
#pr{height:5px;background:var(--gray);border-radius:3px;margin:18px 0 6px;overflow:hidden}
#pr i{display:block;height:100%;width:0;background:var(--tx);opacity:.7}
.tm{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.ctl{display:flex;justify-content:center;align-items:center;gap:36px;font-size:30px;margin:12px 0 20px}
.ctl .pp{font-size:42px}
.sg{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:.5px solid var(--bd);cursor:pointer}
.sg em{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--gray);font-style:normal;font-size:20px}
.sg small{display:block;color:var(--mut)}
/* phone */
#dn{height:60px;text-align:center;font-size:36px;margin:10px 0 18px;overflow:hidden}
#dp{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center}
#dp button{width:76px;height:76px;border-radius:50%;background:var(--gray);font-size:30px}
#dp .call{background:#30d158;color:#fff;font-size:30px}
.cr{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card);margin-top:18px;cursor:pointer}
.cr .av{width:40px;height:40px;font-size:18px}
#callscr{position:absolute;inset:0;z-index:10;background:linear-gradient(#3a3d4a,#14151b);color:#fff;display:none;flex-direction:column;align-items:center;padding-top:130px}
#callscr.on{display:flex}#callscr h2{margin:14px 0 4px;font-size:32px}#callscr p{margin:0;opacity:.7}
#callscr .end{margin-top:auto;margin-bottom:80px;width:72px;height:72px;border-radius:50%;background:#ff3b30;font-size:30px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(#b4b9c4,#7c818d);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:600}
/* messages */
#ml,#mc{position:absolute;inset:0;background:var(--bg);transition:transform .3s}
#mc{transform:translateX(100%);z-index:3}#mc.on{transform:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;border-bottom:.5px solid var(--bd)}
.row .av{width:48px;height:48px;font-size:20px;flex:none}.row>div:not(.av){flex:1;min-width:0}.row b{display:block}
.row span{color:var(--mut);font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:11px;height:11px;border-radius:50%;background:var(--blue)}
.mh{position:absolute;top:0;left:0;right:0;z-index:10;padding:52px 12px 0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.mh>*{pointer-events:auto}
.mh::before{content:"";position:absolute;inset:0 0 -14px;z-index:-1;pointer-events:none;background:linear-gradient(var(--bg) 40%,transparent)}
.circle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--blue);font-size:24px}
.who{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:12px}
.nm{font-size:12px;font-weight:500;padding:3px 10px;border-radius:12px}
.pts{height:44px;min-width:60px;padding:0 14px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:15px;font-weight:600}
#chat{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;padding:150px 14px 96px}
.stamp{align-self:center;color:var(--mut);font-size:11px;margin:0 0 10px}
.note{align-self:center;color:var(--mut);font-size:12px;text-align:center;max-width:85%;margin:10px 0}
.m{max-width:75%;padding:7px 13px 8px;border-radius:19px;font-size:17px;line-height:1.28;position:relative;word-wrap:break-word;animation:pop .28s cubic-bezier(.2,1.2,.4,1);margin-top:2px;user-select:text}
.me{align-self:flex-end;background:linear-gradient(#2b92ff,#007aff);color:#fff}
.t{align-self:flex-start;background:var(--gray);color:var(--grayT)}
.m.first{margin-top:9px}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(8px)}to{opacity:1;transform:none}}
.m.tail::before,.m.tail::after{content:"";position:absolute;bottom:0;height:18px}
.me.tail::before{right:-7px;width:20px;background:#007aff;border-bottom-left-radius:16px 14px}
.me.tail::after{right:-26px;width:26px;background:var(--bg);border-bottom-left-radius:10px}
.t.tail::before{left:-7px;width:20px;background:var(--gray);border-bottom-right-radius:16px 14px}
.t.tail::after{left:-26px;width:26px;background:var(--bg);border-bottom-right-radius:10px}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:8px;height:8px;border-radius:50%;background:#9a9aa0;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.status{align-self:flex-end;font-size:11px;font-weight:600;color:var(--mut);margin:3px 4px 0 0}
#bar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:8px;padding:0 12px 34px}
#bar::before{content:"";position:absolute;inset:-30px 0 0;z-index:-1;pointer-events:none;background:linear-gradient(transparent,var(--bg) 60%)}
.plus{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--mut);font-size:24px}
.field{flex:1;display:flex;align-items:center;border-radius:22px;padding:0 5px 0 16px;min-height:44px}
#inp{flex:1;border:0;outline:0;background:transparent;color:var(--tx);font:inherit;font-size:17px;padding:10px 0;min-width:0;user-select:text}
#inp::placeholder{color:var(--ph)}
#send{width:34px;height:34px;border-radius:50%;background:linear-gradient(#2b92ff,#007aff);display:none;place-items:center;color:#fff;font-size:18px;font-weight:700}
#send.on{display:grid}
.endc{position:absolute;left:12px;right:12px;bottom:40px;z-index:11;text-align:center;padding:18px 20px;border-radius:28px}
.endc h3{margin:0 0 4px}.endc p{margin:0 0 14px;color:var(--mut);font-size:14px}
.endc button{background:linear-gradient(#2b92ff,#007aff);color:#fff;border-radius:22px;padding:11px 26px;font-weight:600}
#err{display:none;position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#ff3b30;color:#fff;padding:10px;border-radius:10px;font:13px monospace;white-space:pre-wrap}
.av{background-size:cover;background-position:center}
</style>
</head>
<body>
<div id="err"></div>
<div id="phone" data-view="lock">
  <div id="wall"></div>
  <div id="sb"><span class="clk"></span><span>5G ▮</span></div>

  <!-- LOCKSCREEN -->
  <section id="lock" class="scr on">
    <div id="ld"></div><div id="lt" class="clk2"></div>
    <div id="nw"></div>
    <div id="hint">Geser ke atas untuk membuka</div>
  </section>

  <!-- PIN -->
  <section id="pin" class="scr">
    <h2>Masukkan PIN</h2>
    <div id="dots"><i></i><i></i><i></i><i></i></div>
    <div id="kp"></div>
    <button id="cancel" style="color:#fff;margin-top:26px;font-size:17px">Batal</button>
  </section>

  <!-- HOMESCREEN -->
  <section id="home" class="scr">
    <div id="grid">
      <button class="app-i" data-app="photos"><div class="ico" style="background:url(gallery.jpg) center/cover"></div>Galeri</button>
      <button class="app-i" data-app="music"><div class="ico" style="background:url(apmusic.jpg) center/cover"></div>Musik</button>
    </div>
    <div id="dock" class="g">
      <button class="app-i" data-app="phone"><div class="ico" style="background:url(telephone.jpg) center/cover"></div><span>Telepon</span></button>
      <button class="app-i" data-app="msg"><div class="ico" style="background:url(imess.jpg) center/cover"></div><div class="bdg" id="badge">1</div><span>Pesan</span></button>
    </div>
  </section>

  <!-- APPS -->
  <div class="app" id="a-photos">
    <div class="top"><h1>Galeri</h1></div>
    <button class="plus-b glass" id="addp">+</button>
    <input type="file" id="up" accept="image/*" multiple hidden>
    <div class="body"><div id="pg"></div></div>
    <div id="viewer"></div>
  </div>

  <div class="app" id="a-music">
    <div class="top"><h1>Musik</h1></div>
    <div class="body" style="padding-top:110px">
      <div id="art">🌧️</div>
      <div class="mt"><b id="mti"></b><span id="mar"></span></div>
      <div id="pr"><i></i></div>
      <div class="tm"><span id="t1">0:00</span><span id="t2">3:00</span></div>
      <div class="ctl"><button id="prv">⏮</button><button id="pl" class="pp">▶️</button><button id="nxt">⏭</button></div>
      <div id="sl"></div>
    </div>
  </div>

  <div class="app" id="a-phone">
    <div class="top"><h1>Telepon</h1></div>
    <div class="body" style="padding-top:110px">
      <div id="dn"></div>
      <div id="dp"></div>
      <div class="cr" id="crow"><div class="av">A</div><div><b>apidd</b><br><small style="color:var(--mut)">seluler</small></div></div>
    </div>
    <div id="callscr"><div class="av" style="width:90px;height:90px;font-size:40px" id="cav">A</div><h2 id="cn"></h2><p id="cs"></p><button class="end" id="endc">📞</button></div>
  </div>

  <div class="app" id="a-msg">
    <div id="ml">
      <div class="top"><h1>Pesan</h1></div>
      <div class="body">
        <div class="row" id="mrow"><div class="av">A</div><div><b>apidd</b><span id="mprev"></span></div><i class="dot" id="udot"></i></div>
      </div>
    </div>
    <div id="mc">
      <div class="mh">
        <button class="circle glass" id="mback">‹</button>
        <div class="who"><div class="av">A</div><div class="nm glass">apidd</div></div>
        <div class="pts glass">♥&nbsp;<span id="pt">0</span></div>
      </div>
      <div id="chat"></div>
      <div id="bar">
        <div class="plus glass">+</div>
        <div class="field glass"><input id="inp" placeholder="Pesan" autocomplete="off" enterkeyhint="send"><button id="send">↑</button></div>
      </div>
    </div>
  </div>

  <div id="hbar"><i></i></div>
</div>

<script>
window.addEventListener("error",function(e){var b=document.getElementById("err");b.style.display="block";b.textContent="Error: "+e.message+(e.lineno?" (baris "+e.lineno+")":"")});
</script>
<script>
/* ===== PENGATURAN & CERITA (EDIT DI SINI) ===== */
const PIN="4130", CONTACT="apidd";
const STAGES=[
 {ask:["Sayang udah beli ice creamnya?","Kalo udah ayo kita pulang."],
  rules:[{k:/udah|sudah|dah/,r:["yaudah ayo pulang."],p:1},{k:/belum|blm|ngantri|antri/,r:["yah lama banget, cepetan dong."],p:0}],
  def:{r:["beli apa lagi??"],p:0}},
 {ask:["yaudah aku tunggu di mobil ya."],
  rules:[{k:/semenit lagi|lagi ngantri|bentar dulu/,r:["iya aku tungguin."],p:-1},{k:/\b(oke|ok|siap|iya|ya)\b/,r:["jangan lama-lama ya."],p:1}],
  def:{r:["hmm, yaudah."],p:0}}
];
const GLOBAL=[
 {k:/makasih|terima kasih|thanks|tengkyu/,r:"Sama-sama!",p:1},
 {k:/sayang|cinta|kangen/,r:"Aku juga sayang kamu 🥰",p:1},
 {k:/bodoh|bego|jelek|benci|bacot|anjing|sialan/,r:"Wah, santai dong.",p:-2}
];
const SONGS=[
 ["Firasat","Marcell","firasat.jpg"],
 ["Kisah Romantis","Glenn Fredly","kisahromantis.jpg"],
 ["Bentang Jarak Asmara","Traffic Jam","bentang.jpg"],
 ["Lenggang Puspita","Afgan","lenggang.jpg"]
];

/* ===== SISTEM PHONE ===== */
const $=id=>document.getElementById(id),ph=$("phone");
document.querySelectorAll(".av").forEach(a=>{a.style.backgroundImage="url(apidd.jpg)";a.textContent=""});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const p2=n=>String(n).padStart(2,"0");
function clock(){const d=new Date();document.querySelectorAll(".clk").forEach(e=>e.textContent=d.getHours()+":"+p2(d.getMinutes()));
 $("lt").textContent=p2(d.getHours())+":"+p2(d.getMinutes());
 $("ld").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}
clock();setInterval(clock,10000);
function show(id){["lock","pin","home"].forEach(s=>$(s).classList.toggle("on",s===id));ph.dataset.view=id}
let cur=null,afterUnlock=null;
function openApp(id,from){
  const a=$("a-"+id);
  if(from){const r=from.getBoundingClientRect(),p=ph.getBoundingClientRect();a.style.transformOrigin=(r.left+r.width/2-p.left)+"px "+(r.top+r.height/2-p.top)+"px"}
  a.classList.add("open");cur=a;ph.dataset.view="app";
  if(id==="msg"&&afterUnlock==="chat"){afterUnlock=null;openChat()}
}
function closeApp(){if(!cur)return;cur.classList.remove("open");cur=null;ph.dataset.view="home"}
$("hbar").onclick=()=>{if(cur)closeApp()};
document.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>openApp(b.dataset.app,b.querySelector(".ico")));

/* lockscreen + notifikasi */
setTimeout(()=>{
  const n=document.createElement("div");n.className="notif g";
  n.innerHTML='<div class="ic"></div><div style="flex:1;min-width:0"><div class="nt"><b>'+CONTACT+'</b><time>sekarang</time></div><p></p></div>';
  n.querySelector("p").textContent=STAGES[0].ask[0];
  n.onclick=()=>{afterUnlock="chat";show("pin")};
  $("nw").appendChild(n);
  if(navigator.vibrate)navigator.vibrate(120);
},1500);
let y0=null;
$("lock").addEventListener("pointerdown",e=>{y0=e.clientY});
$("lock").addEventListener("pointerup",e=>{if(y0!==null&&y0-e.clientY>60)show("pin");y0=null});
$("hint").onclick=()=>show("pin");

/* PIN */
let ent="";
const kp=$("kp");
["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k=>{
  const b=document.createElement("button");b.textContent=k;if(!k)b.className="e";if(k==="⌫")b.className="e";
  b.onclick=()=>{if(k==="⌫")ent=ent.slice(0,-1);else if(k&&ent.length<4)ent+=k;drawDots();if(ent.length===4)check()};
  kp.appendChild(b);
});
function drawDots(){[...$("dots").children].forEach((d,i)=>d.classList.toggle("f",i<ent.length))}
async function check(){
  await wait(150);
  if(ent===PIN){ent="";drawDots();show("home");if(afterUnlock==="chat"){await wait(250);openApp("msg",document.querySelector('[data-app=msg] .ico'))}}
  else{$("dots").classList.add("sh");if(navigator.vibrate)navigator.vibrate(200);await wait(420);$("dots").classList.remove("sh");ent="";drawDots()}
}
$("cancel").onclick=()=>{ent="";drawDots();afterUnlock=null;show("lock")};

/* GALERI */
const PH=[["🌅","#ff9a8b,#ff6a88"],["🍦","#fbc2eb,#a6c1ee"],["🚗","#84fab0,#8fd3f4"],["🌧️","#a1c4fd,#c2e9fb"],["🎸","#f6d365,#fda085"],["🌸","#ffecd2,#fcb69f"],["🐱","#cfd9df,#e2ebf0"],["☕","#d4a373,#8d6e63"],["🌙","#667eea,#764ba2"]];
function tile(em,bg,img){
  const t=document.createElement("div");t.className="tile";
  if(img){t.style.backgroundImage="url("+img+")"}else{t.style.background="linear-gradient(135deg,"+bg+")";t.textContent=em}
  t.onclick=()=>{const v=$("viewer");v.style.display="grid";v.textContent=img?"":em;v.style.backgroundImage=img?"url("+img+")":"none";v.style.backgroundColor=img?"#000":"#000"};
  $("pg").appendChild(t);
}
PH.forEach(p=>tile(p[0],p[1]));
$("viewer").onclick=()=>{$("viewer").style.display="none"};
$("addp").onclick=()=>$("up").click();
$("up").onchange=e=>{[...e.target.files].forEach(f=>tile("","",URL.createObjectURL(f)))};

/* MUSIK */
let si=0,pos=0,playing=false;const DUR=180;
const fm=s=>Math.floor(s/60)+":"+p2(s%60);
SONGS.forEach((s,i)=>{const r=document.createElement("div");r.className="sg";r.innerHTML='<em style="background:url('+s[2]+') center/cover"></em><div><b>'+s[0]+'</b><small>'+s[1]+'</small></div>';r.onclick=()=>{si=i;pos=0;playing=true;upd()};$("sl").appendChild(r)});
function upd(){const s=SONGS[si];$("mti").textContent=s[0];$("mar").textContent=s[1];$("art").style.background="url("+s[2]+") center/cover";$("art").textContent="";$("art").classList.toggle("p",playing);
 $("pl").textContent=playing?"⏸️":"▶️";$("pr").firstElementChild.style.width=(pos/DUR*100)+"%";$("t1").textContent=fm(pos);$("t2").textContent="-"+fm(DUR-pos)}
function nextS(d){si=(si+d+SONGS.length)%SONGS.length;pos=0;upd()}
$("pl").onclick=()=>{playing=!playing;upd()};$("nxt").onclick=()=>nextS(1);$("prv").onclick=()=>nextS(-1);
setInterval(()=>{if(playing){pos++;if(pos>=DUR)nextS(1);else upd()}},1000);upd();

/* TELEPON */
let dial="";
"123456789*0#".split("").forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{if(dial.length<15){dial+=k;$("dn").textContent=dial}};$("dp").appendChild(b)});
const cb=document.createElement("button");cb.className="call";cb.textContent="📞";cb.onclick=()=>{if(dial)call(dial)};
const db=document.createElement("button");db.textContent="⌫";db.style.fontSize="24px";db.onclick=()=>{dial=dial.slice(0,-1);$("dn").textContent=dial};
$("dp").append(document.createElement("span"),cb,db);
$("crow").onclick=()=>call(CONTACT);
let ct=null;
function call(name){
  $("cn").textContent=name;$("cav").textContent=name[0].toUpperCase();$("cs").textContent="memanggil...";$("callscr").classList.add("on");
  let s=0;clearInterval(ct);
  setTimeout(()=>{if(!$("callscr").classList.contains("on"))return;$("cs").textContent="00:00";ct=setInterval(()=>{s++;$("cs").textContent=p2(Math.floor(s/60))+":"+p2(s%60)},1000)},2500);
}
$("endc").onclick=()=>{clearInterval(ct);$("callscr").classList.remove("on")};

/* PESAN */
const chat=$("chat"),inp=$("inp"),sendBtn=$("send"),bar=$("bar"),pt=$("pt");
let score=0,stage=0,busy=false,started=false,lastSide=null,lastBubble=null,statusEl=null;
const bot=()=>{chat.scrollTop=chat.scrollHeight};
$("mprev").textContent=STAGES[0].ask[0];
function openChat(){$("mc").classList.add("on");$("udot").style.display="none";$("badge").style.display="none";startChat()}
$("mrow").onclick=openChat;$("mback").onclick=()=>$("mc").classList.remove("on");
function stamp(){const d=new Date(),s=document.createElement("div");s.className="stamp";s.innerHTML="<b>Hari ini</b> "+p2(d.getHours())+"."+p2(d.getMinutes());chat.appendChild(s)}
function place(el,side){if(lastBubble&&lastSide===side)lastBubble.classList.remove("tail");else el.classList.add("first");el.classList.add("tail");lastBubble=el;lastSide=side}
function add(side,txt){const d=document.createElement("div");d.className="m "+side;d.textContent=txt;place(d,side);chat.appendChild(d);bot();$("mprev").textContent=txt;return d}
function note(txt){const d=document.createElement("div");d.className="note";d.textContent=txt;chat.appendChild(d);lastBubble=null;lastSide=null;bot()}
function typing(){const d=document.createElement("div");d.className="m t typing";d.innerHTML="<i></i><i></i><i></i>";if(lastBubble&&lastSide==="t")lastBubble.classList.remove("tail");else d.classList.add("first");d.classList.add("tail");chat.appendChild(d);bot();return d}
async function say(list){
  for(const raw of list){
    if(raw.startsWith("n:")){await wait(600);note(raw.slice(2))}
    else{
      const ty=typing();
      if(statusEl&&statusEl.textContent==="Terkirim")statusEl.textContent="Dibaca";
      await wait(600+raw.length*20);
      const prev=lastBubble;ty.remove();if(prev&&lastSide==="t")prev.classList.add("tail");
      add("t",raw);
    }
    await wait(250);
  }
}
function lockI(v){busy=v;inp.disabled=v;if(!v)inp.focus()}
async function startChat(){
  if(started)return;started=true;stamp();add("t",STAGES[0].ask[0]);
  lockI(true);await wait(500);await say(STAGES[0].ask.slice(1));lockI(false);
}
async function ask(){lockI(true);await say(STAGES[stage].ask);lockI(false)}
async function submit(){
  const text=inp.value.trim();if(!text||busy)return;
  inp.value="";sendBtn.classList.remove("on");
  if(statusEl){statusEl.remove();statusEl=null}
  add("me",text);
  statusEl=document.createElement("div");statusEl.className="status";statusEl.textContent="Terkirim";chat.appendChild(statusEl);bot();
  lockI(true);
  const s=STAGES[stage],low=text.toLowerCase();
  const rule=s.rules.find(x=>x.k.test(low))||s.def;score+=rule.p;
  const extra=GLOBAL.find(x=>x.k.test(low)),out=[...rule.r];
  if(extra){score+=extra.p;out.push(extra.r)}
  pt.textContent=score;await wait(500);await say(out);
  stage++;if(stage>=STAGES.length)return ending();ask();
}
inp.addEventListener("input",()=>sendBtn.classList.toggle("on",inp.value.trim().length>0));
inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
sendBtn.onclick=submit;
</script>
